# Render runs the Flask API. The Vite frontend is deployed separately on Vercel.
services:
  - type: web
    name: peoplecareai-santanu-api
    runtime: python
    region: singapore
    plan: free
    rootDir: communitysignalai
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: PEOPLECARE_ENV
        value: production
      - key: PEOPLECARE_HOST
        value: 0.0.0.0
      - key: PEOPLECARE_DEBUG
        value: "false"
      - key: PEOPLECARE_ADMIN_DEV_BYPASS
        value: "false"
      - key: PEOPLECARE_PROVIDER
        value: openai_compatible
      - key: PEOPLECARE_OLLAMA_PRELOAD
        value: "false"
      - key: PEOPLECARE_ADMIN_PASSWORD
        sync: false
